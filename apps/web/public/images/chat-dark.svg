<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="390" height="800" role="img" aria-label="Chatbot conversation that books a site visit">
<rect width="390" height="800" fill="#0E1116"/><rect width="390" height="84" fill="#2DD4BF"/>
<circle cx="40" cy="48" r="18" fill="#171B22"/><text x="70" y="46" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" fill="#0E1116">Skyline Realty</text><text x="70" y="66" font-family="Inter,Arial,sans-serif" font-size="12" fill="#0E1116">Replies in seconds</text>
<rect x="20" y="110" width="250" height="72" rx="16" fill="#171B22"/><text x="34" y="138" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">Hi! Looking for a home in</text><text x="34" y="158" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">Bengaluru? I can help.</text>
<rect x="130" y="200" width="240" height="48" rx="16" fill="#2DD4BF"/><text x="144" y="228" font-family="Inter,Arial,sans-serif" font-size="14" fill="#0E1116">2 BHK, around ₹85 L</text>
<rect x="20" y="268" width="290" height="94" rx="16" fill="#171B22"/><text x="34" y="296" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">Great. Three matches in</text><text x="34" y="316" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">Whitefield. Want to see them</text><text x="34" y="336" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">this weekend?</text>
<rect x="180" y="380" width="190" height="48" rx="16" fill="#2DD4BF"/><text x="194" y="408" font-family="Inter,Arial,sans-serif" font-size="14" fill="#0E1116">Saturday, 11 am</text>
<rect x="20" y="446" width="300" height="94" rx="16" fill="#171B22"/><text x="34" y="474" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">Booked: Sat 11:00 am.</text><text x="34" y="494" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">Directions follow on</text><text x="34" y="514" font-family="Inter,Arial,sans-serif" font-size="14" fill="#E8ECF1">WhatsApp. Reply to change.</text>
<rect x="20" y="720" width="350" height="48" rx="24" fill="#171B22" stroke="#2A303A"/><text x="44" y="750" font-family="Inter,Arial,sans-serif" font-size="14" fill="#9AA4B2">Type a message</text>
</svg>