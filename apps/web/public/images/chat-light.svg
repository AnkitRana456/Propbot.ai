<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="390" height="800" role="img" aria-label="Chatbot conversation that books a site visit">
<rect width="390" height="800" fill="#F6F7F9"/><rect width="390" height="84" fill="#0F766E"/>
<circle cx="40" cy="48" r="18" fill="#FFFFFF"/><text x="70" y="46" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Skyline Realty</text><text x="70" y="66" font-family="Inter,Arial,sans-serif" font-size="12" fill="#FFFFFF">Replies in seconds</text>
<rect x="20" y="110" width="250" height="72" rx="16" fill="#FFFFFF"/><text x="34" y="138" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Hi! Looking for a home in</text><text x="34" y="158" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Bengaluru? I can help.</text>
<rect x="130" y="200" width="240" height="48" rx="16" fill="#0F766E"/><text x="144" y="228" font-family="Inter,Arial,sans-serif" font-size="14" fill="#FFFFFF">2 BHK, around ₹85 L</text>
<rect x="20" y="268" width="290" height="94" rx="16" fill="#FFFFFF"/><text x="34" y="296" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Great. Three matches in</text><text x="34" y="316" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Whitefield. Want to see them</text><text x="34" y="336" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">this weekend?</text>
<rect x="180" y="380" width="190" height="48" rx="16" fill="#0F766E"/><text x="194" y="408" font-family="Inter,Arial,sans-serif" font-size="14" fill="#FFFFFF">Saturday, 11 am</text>
<rect x="20" y="446" width="300" height="94" rx="16" fill="#FFFFFF"/><text x="34" y="474" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Booked: Sat 11:00 am.</text><text x="34" y="494" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Directions follow on</text><text x="34" y="514" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">WhatsApp. Reply to change.</text>
<rect x="20" y="720" width="350" height="48" rx="24" fill="#FFFFFF" stroke="#E3E6EB"/><text x="44" y="750" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5B6573">Type a message</text>
</svg>