<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Shared inbox with a WhatsApp conversation that books a site visit"><rect width="1200" height="750" fill="#F6F7F9"/><rect width="200" height="750" fill="#FFFFFF"/><line x1="200" x2="200" y2="750" stroke="#E3E6EB"/><rect x="20" y="24" width="28" height="28" rx="7" fill="#0F766E"/><text x="58" y="44" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" fill="#12161C">PropBot</text><rect x="12" y="86" width="176" height="36" rx="8" fill="none"/><text x="36" y="109" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6573">Overview</text><rect x="12" y="130" width="176" height="36" rx="8" fill="none"/><text x="36" y="153" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6573">Leads</text><rect x="12" y="174" width="176" height="36" rx="8" fill="#DDF2EF"/><text x="36" y="197" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F766E">Inbox</text><rect x="12" y="218" width="176" height="36" rx="8" fill="none"/><text x="36" y="241" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6573">Appointments</text><rect x="12" y="262" width="176" height="36" rx="8" fill="none"/><text x="36" y="285" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6573">Chatbots</text><rect x="12" y="306" width="176" height="36" rx="8" fill="none"/><text x="36" y="329" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6573">Billing</text><text x="236" y="56" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="26" fill="#12161C">Inbox</text><rect x="224" y="96" width="340" height="72" rx="10" fill="#DDF2EF" stroke="#E3E6EB"/><circle cx="254" cy="132" r="16" fill="#0F766E" opacity="0.2"/><text x="282" y="124" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#12161C">Priya Sundaram</text><text x="282" y="146" font-family="Inter,Arial,sans-serif" font-size="12" fill="#5B6573">Can we visit Saturday at 11?</text><text x="540" y="124" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5B6573">WhatsApp</text><rect x="224" y="178" width="340" height="72" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><circle cx="254" cy="214" r="16" fill="#0F766E" opacity="0.2"/><text x="282" y="206" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#12161C">Aarav Malhotra</text><text x="282" y="228" font-family="Inter,Arial,sans-serif" font-size="12" fill="#5B6573">What is the possession date?</text><text x="540" y="206" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5B6573">Web chat</text><rect x="224" y="260" width="340" height="72" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><circle cx="254" cy="296" r="16" fill="#0F766E" opacity="0.2"/><text x="282" y="288" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#12161C">Rohan Mehra</text><text x="282" y="310" font-family="Inter,Arial,sans-serif" font-size="12" fill="#5B6573">Share the floor plan please</text><text x="540" y="288" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5B6573">WhatsApp</text><rect x="224" y="342" width="340" height="72" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><circle cx="254" cy="378" r="16" fill="#0F766E" opacity="0.2"/><text x="282" y="370" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#12161C">Neha Kapoor</text><text x="282" y="392" font-family="Inter,Arial,sans-serif" font-size="12" fill="#5B6573">Thanks, see you then</text><text x="540" y="370" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5B6573">Web chat</text><rect x="580" y="84" width="580" height="620" rx="14" fill="#FFFFFF" stroke="#E3E6EB"/><text x="604" y="118" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#12161C">Priya Sundaram</text><rect x="1040" y="100" width="100" height="26" rx="13" fill="#CCFBF1"/><text x="1090" y="118" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#115E59">Hot · 92</text><line x1="580" x2="1160" y1="140" y2="140" stroke="#E3E6EB"/><rect x="604" y="164" width="330" height="64" rx="14" fill="#F6F7F9"/><text x="618" y="190" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Hi, is the 3 BHK in Koramangala</text><text x="618" y="210" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">still available?</text><rect x="790" y="244" width="350" height="64" rx="14" fill="#0F766E"/><text x="804" y="270" font-family="Inter,Arial,sans-serif" font-size="14" fill="#FFFFFF">Yes! Ready to move in. Want to</text><text x="804" y="290" font-family="Inter,Arial,sans-serif" font-size="14" fill="#FFFFFF">see it this weekend?</text><rect x="604" y="324" width="280" height="44" rx="14" fill="#F6F7F9"/><text x="618" y="350" font-family="Inter,Arial,sans-serif" font-size="14" fill="#12161C">Saturday at 11 works.</text><rect x="760" y="392" width="380" height="64" rx="14" fill="#0F766E"/><text x="774" y="418" font-family="Inter,Arial,sans-serif" font-size="14" fill="#FFFFFF">Booked for Sat 11:00 am. I will send</text><text x="774" y="438" font-family="Inter,Arial,sans-serif" font-size="14" fill="#FFFFFF">directions on WhatsApp.</text><rect x="604" y="640" width="532" height="44" rx="22" fill="#F6F7F9" stroke="#E3E6EB"/><text x="628" y="668" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5B6573">Take over this conversation</text></svg>